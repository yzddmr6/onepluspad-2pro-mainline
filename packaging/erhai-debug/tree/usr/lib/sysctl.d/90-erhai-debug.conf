# Development and debug sessions only. This file belongs to erhai-debug,
# which the published root filesystem and normal installations do not carry.
#
# Turn a hang into a reboot. A task stuck in uninterruptible sleep for 120 s,
# a soft lockup or an oops panics the kernel, and the panic reboots the tablet
# 10 s later. Without this, a driver that hangs, for example while the system
# shuts down, keeps the tablet on until the power key is held, and a test
# session that nobody attends cannot recover on its own.
#
# The first two settings need a kernel built with hung task and soft lockup
# detection; on an older kernel systemd-sysctl warns and skips them.
kernel.hung_task_timeout_secs = 120
kernel.hung_task_panic = 1
kernel.softlockup_panic = 1
kernel.panic_on_oops = 1
kernel.panic = 10
