# Allow the Iris VA driver, which is not in GStreamer's built-in vendor list.
GST_VA_ALL_DRIVERS=1
# Share the Iris VA adapter with Firefox instead of using the generic V4L2 path.
# Respect an explicit user/session rank override.
GST_PLUGIN_FEATURE_RANK=${GST_PLUGIN_FEATURE_RANK:-vah264dec:512,vah265dec:512,vavp9dec:512}
