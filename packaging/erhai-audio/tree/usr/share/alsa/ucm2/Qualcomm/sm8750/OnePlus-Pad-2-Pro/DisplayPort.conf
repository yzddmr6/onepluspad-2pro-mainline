# A separate stream in HiFi keeps capture available during external playback.
# The sound server opens every PCM of the verb when it probes the profile, before
# any device is enabled, and a front end without a back end fails to open. So
# MultiMedia2 stays routed to DisplayPort for as long as the verb is active,
# and the probe opens it with or without a monitor.
SectionVerb {
	EnableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 1,1"
	]
	DisableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 0,0"
	]
}

SectionDevice."HDMI" {
	Comment "HDMI / DisplayPort audio"
	EnableSequence [
		cset "name='stream1.vol_ctrl1 MultiMedia2 Playback Volu' 8192"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 1,1"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		PlaybackRate 48000
		JackControl "DP0 Jack"
	}
}
