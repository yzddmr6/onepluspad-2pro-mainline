# A separate stream in HiFi keeps capture available during external playback.
SectionDevice."HDMI" {
	Comment "HDMI / DisplayPort audio"
	EnableSequence [
		cset "name='stream1.vol_ctrl1 MultiMedia2 Playback Volu' 8192"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 1,1"
	]
	DisableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 0,0"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		PlaybackRate 48000
		JackControl "DP0 Jack"
	}
}
