#
# Internal speaker playback: CANDIDATE, OFF BY DEFAULT.
#
# HiFi.conf includes this file only while /run/erhai-audio/speaker-enabled
# exists, which erhai-audio-speaker enable creates for the running boot; a
# reboot or erhai-audio-speaker disable takes the device away again. Without
# it no playback device is offered and desktop sound never reaches the
# amplifiers. Enable it for a listening check only after the silent DSP
# acceptance and the signal-path test have passed on the installed kernel.
#
# The MultiMedia1 playback PCM (device 0) is stereo, 16-bit, 48 kHz. As in the
# original firmware's speaker graph, the DSP spreads it over the eight 32-bit
# TDM slots: the topology gives the speaker MFC the original 8x2 channel mixer
# (left on even slots, right on odd slots), so no ALSA plugin is involved:
#
#   slot 0  Amp0  left, top       slot 1  Amp1  right, bottom
#   slot 2  Amp2  left, bottom    slot 3  Amp3  right, top
#   slot 4  no amplifier          slot 5  Amp5  right, high
#   slot 6  Amp6  left, high      slot 7  no amplifier
#
# Left/right follows the original mixer and mixer paths; top/bottom/high are
# the original test labels and still need a listening check.
#
# Levels. The original graph also has vendor speaker protection and per-
# speaker tuning, which this path lacks. The original ACF profile ("Music",
# the only one) runs every amplifier at -2.5 dB (SYSCTRL2 VOL 0x14 in 1/8 dB)
# with no volume on top, i.e. 350 in the driver's -90 dB + 0.25 dB per step
# scale, which is what the enable sequence below uses. The stream gain stays
# at 8192, unity in the DSP's Q13 format, because it is not a volume control:
# anything above unity multiplies in the DSP and clips full-scale samples
# before the amplifiers can attenuate them, which is audible as harsh
# distortion at high system volume and cannot be undone downstream. PipeWire's
# software volume only attenuates below 100 %; keep GNOME's over-amplification
# off while the candidate is enabled. The high speakers receive the full band.
#
# Note that -2.5 dB is the level the vendor firmware used with its protection
# stage active. Without that stage nothing limits excursion, so content the
# original graph would have held back can drive the speakers harder than
# intended; the previous 270 (-22.5 dB, 20 dB lower) was a deliberate margin.

SectionDevice."Speaker" {
	Comment "Speakers"
	EnableSequence [
		cset "name='Amp0 PCM Playback Volume' 350"
		cset "name='Amp1 PCM Playback Volume' 350"
		cset "name='Amp2 PCM Playback Volume' 350"
		cset "name='Amp3 PCM Playback Volume' 350"
		cset "name='Amp5 PCM Playback Volume' 350"
		cset "name='Amp6 PCM Playback Volume' 350"
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
		cset "name='Secondary TDM0 Audio Mixer MultiMedia1' 1,1"
	]
	DisableSequence [
		cset "name='Secondary TDM0 Audio Mixer MultiMedia1' 0,0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
