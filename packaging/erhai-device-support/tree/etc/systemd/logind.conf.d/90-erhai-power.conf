# GNOME Settings Daemon owns the power key and its configurable lock action.
# Ignore the button here even when the desktop has not taken its inhibitor.
# Closing the cover suspends the system, as on the stock firmware; opening it
# wakes the system again. logind keeps the system awake while an external
# display is connected.
[Login]
HandlePowerKey=ignore
HandleLidSwitch=suspend
