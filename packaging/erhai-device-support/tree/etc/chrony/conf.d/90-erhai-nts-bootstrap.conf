# After a forced reset the PMIC RTC can come back without a valid time, and
# the system then starts with a clock months in the past. At that time the NTS
# server certificates are not valid yet, so chrony would never synchronise.
# Skip only the certificate time check, and only for the first clock update;
# the certificates themselves are still verified.
nocerttimecheck 1
# Some networks pass the NTS key exchange but not authenticated NTP, which
# leaves only the network's own time source (from DHCP) reachable. In the
# default mode chrony then never synchronises. Select sources regardless of
# authentication: the NTS pools carry the prefer option and still win when
# they are reachable, and the network source is used when they are not.
authselectmode ignore
