# SPDX-License-Identifier: MIT
# Adapted from the piano TuneD profile structure; limits are erhai OPPs.
[main]
summary=OnePlus Pad 2 Pro power-saver CPU and GPU policy

# SCMI exposes two policies and prime-core boost up to 4320000 kHz.
# Keep schedutil and the hardware minima; thermal/firmware limits still apply.
[sysfs]
/sys/devices/system/cpu/cpufreq/boost=0
/sys/devices/system/cpu/cpufreq/policy0/scaling_governor=schedutil
/sys/devices/system/cpu/cpufreq/policy6/scaling_governor=schedutil
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq=384000
/sys/devices/system/cpu/cpufreq/policy6/scaling_min_freq=1017600
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=1785600
/sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq=1958400
/sys/class/devfreq/3d00000.gpu/min_freq=160000000
/sys/class/devfreq/3d00000.gpu/max_freq=342000000
